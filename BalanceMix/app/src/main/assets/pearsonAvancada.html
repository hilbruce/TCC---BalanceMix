<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Esta é a Calculadora Pearson Avançada">
  <meta name="author" content="Hilton Bruce">
  <link rel="stylesheet" href="estilo/base.css">
  <link rel="stylesheet" href="estilo/baseInicial.css">
  <link rel="stylesheet" href="estilo/baseResponsiva.css">
  <link rel="stylesheet" href="estilo/hamburguerMenu.css">
  <link rel="stylesheet" href="estilo/pearsonAvancada.css">
  <link rel="stylesheet" href="estilo/scroll.css">
  <link rel="stylesheet" href="estilo/confirmacao.css">
  <title>Calculadora Pearson Avançada</title>
</head>

<body>
  <!-- Barra de fundo -->
  <div class="top-bar"></div>

  <!-- Botão hamburguer -->
  <div class="menu-toggle" id="menu-toggle">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- Sobreposição escura -->
  <div class="overlay" id="overlay"></div>

  <!-- Menu superior -->
  <ul class="menu-superior" id="menu-superior">
    <li><a href="index.html">Início</a></li>
    <li><a href="calculadoraPearson.html">Calculadora de Pearson</a></li>
    <li><a href="requisitosNutricionais.html">Requisitos Nutricionais</a></li>
    <li><a href="racoesMontadas.html">Rações Salvas</a></li>
  </ul>

  <!-- Conteúdo principal -->
  <main id="conteudo">
    <h1><br>Calculadora Pearson Avançada</h1>

    <!-- Botão de retorno -->
    <button id="voltarSeletor" type="button" onclick="voltarAoSeletor()">← Voltar ao seletor</button>

    <form id="pearsonFormAvancado">
      <label for="pbDesejada">Proteína Bruta (PB) desejada (%)</label>
      <input type="number" id="pbDesejada" step="0.01" required placeholder="Ex: 18" />

      <!-- Área dinâmica para insumos -->
      <div id="insumosContainer">
        <div class="insumo-item">
          <label>Insumo 1:</label>
          <input type="text" name="nomeInsumo[]" placeholder="Nome do insumo" required />
          <input type="number" name="pbInsumo[]" step="0.01" placeholder="% PB" required />
        </div>
      </div>

      <!-- Botões de controle -->
      <div class="botao-container">
        <button type="button" id="adicionarInsumo">+ Adicionar Insumo</button>
        <button type="button" id="removerInsumo">− Remover Último</button>
      </div>

      <label>Quantidade Total (kg):</label>
      <input type="number" id="quantidadeTotal" step="0.1" required placeholder="Ex: 100" />

      <button type="submit">Calcular</button>
    </form>

    <!-- Resultado -->
    <div id="resultadoPearsonAvancado" class="hidden">
      <h2>Relatório:</h2>
      <p id="resultadoTextoAvancado"></p>
      <button type="button" id="salvarRacaoAvancada">Salvar Ração</button>
    </div>

    <!-- Tela de aviso/intermediária -->
    <div id="telaAviso" class="hidden">
      <div class="confirmacao-conteudo">
        <h2 id="tituloAviso">Aviso</h2>
        <p id="mensagemAviso">Mensagem de aviso aqui.</p>
        <button id="btnConfirmarAviso">OK</button>
        <button id="btnCancelarAviso" class="hidden" style="display: none;">Cancelar</button>
      </div>
    </div>

    <!-- Tela intermediária de confirmação -->
    <div id="telaConfirmacao" class="hidden">
        <div class="confirmacao-conteudo">
            <h2>✅ Ração salva com sucesso!</h2>
            <p>Sua ração foi armazenada e poderá ser consultada em “Rações Montadas”.</p>
            <button id="btnVerRacoes">Ver Rações Salvas</button>
            <button id="btnNovaRacao">Voltar ao Seletor</button>
        </div>
    </div>

  </main>

  <footer class="footer-nav"></footer>

  <script src="script/menuHamburguer.js"></script>
  <script src="script/seletorAnimais.js"></script>
  <script src="script/racoes.js"></script>
  <script src="script/pearsonAvancado.js"></script>
</body>

</html>
